<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Glow &amp; Scent | Authentication</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Open+Sans&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #7b5e57;
      --accent: #3b2f2f;
      --glass: rgba(255, 255, 255, 0.3);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Open Sans', sans-serif;
      background: linear-gradient(135deg, #ffe3d3, #ffe6f0, #f4e8dc);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .bg-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #ffdac1, #ffffff00);
      top: -150px;
      right: -150px;
      filter: blur(100px);
      opacity: 0.5;
      z-index: 0;
    }

    .back-link {
      position: fixed;
      top: 18px;
      left: 22px;
      z-index: 10;
      font-size: 0.9rem;
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0.75;
      transition: opacity 0.2s ease;
    }

    .back-link:hover { opacity: 1; }

    .card {
      position: relative;
      background: var(--glass);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18);
      width: 90%;
      max-width: 420px;
      padding: 2.5rem;
      z-index: 1;
      animation: fadeIn 0.8s ease-out forwards;
    }

    h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--accent);
      text-align: center;
      margin-bottom: 1.5rem;
      line-height: 1.3;
    }

    input, button {
      width: 100%;
      padding: 0.85rem;
      margin-top: 0.7rem;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-family: 'Open Sans', sans-serif;
    }

    input {
      background: rgba(255,255,255,0.85);
      outline: none;
      transition: box-shadow 0.2s ease;
      color: var(--accent);
    }

    input:focus {
      box-shadow: 0 0 0 3px rgba(123, 94, 87, 0.3);
    }

    .card button[type="submit"] {
      background: var(--primary);
      color: white;
      font-weight: bold;
      margin-top: 1.2rem;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .card button[type="submit"]:hover {
      background: #5e443e;
      transform: translateY(-1px);
    }

    /* ── Loading state ── */
    .card button[type="submit"].loading {
      background: #a08880;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* ── Error / success msg ── */
    .msg-box {
      display: none;
      padding: 0.65rem 0.9rem;
      border-radius: 8px;
      margin-top: 0.8rem;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .msg-box.error   { background: #fde8e8; color: #c0392b; display: block; }
    .msg-box.success { background: #e8f8ec; color: #1e7a3a; display: block; }

    .divider {
      text-align: center;
      color: #777;
      margin: 1.4rem 0;
      position: relative;
    }

    .divider::before, .divider::after {
      content: '';
      position: absolute;
      width: 40%;
      height: 1px;
      background: #bbb;
      top: 50%;
    }

    .divider::before { left: 0; }
    .divider::after  { right: 0; }

    .auth-buttons {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      margin-top: 0.5rem;
    }

    .auth-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #444;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Open Sans', sans-serif;
    }

    .auth-btn img { width: 20px; height: 20px; }

    .auth-btn:hover {
      background-color: #f7f0ee;
      transform: translateY(-1px);
      border-color: var(--primary);
    }

    .auth-btn span { flex-grow: 1; text-align: center; }

    .toggle-text {
      text-align: center;
      margin-top: 1.2rem;
      color: var(--accent);
      font-size: 0.95rem;
    }

    .toggle-text a {
      font-weight: bold;
      cursor: pointer;
      color: var(--primary);
      text-decoration: underline;
    }

    /* ── Bottom Sheet ── */
    .bottom-sheet {
      position: fixed;
      bottom: -100%;
      left: 0;
      width: 100%;
      background: #fff;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
      transition: bottom 0.4s ease-in-out;
      z-index: 999;
      padding: 1.8rem 1.5rem;
    }

    .bottom-sheet.active { bottom: 0; }

    .sheet-content {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .sheet-content h3 {
      font-family: 'Playfair Display', serif;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 998;
      display: none;
    }

    .backdrop.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .card { padding: 1.5rem 1rem; border-radius: 16px; }
      h2    { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <a href="index.html" class="back-link">&#8592; Back to Home</a>

  <!-- ─── AUTH CARD ──────────────────────────────────────────── -->
  <div class="card">
    <h2 id="loginTitle">Welcome Back</h2>
    <h2 id="signupTitle" style="display:none;">Join Glow & Scent </h2>

    <!-- Login Form -->
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required autocomplete="email" />
      <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password" />
      <div class="msg-box" id="loginMsg"></div>
      <button type="submit" id="loginBtn">Login</button>
    </form>

    <!-- Sign-up Form -->
    <form id="signupForm" style="display:none;">
      <input type="text" id="signupName" placeholder="Full name" required autocomplete="name" />
      <input type="email" id="signupEmail" placeholder="Email" required autocomplete="email" />
      <input type="password" id="signupPassword" placeholder="Password" required autocomplete="new-password" />
      <input type="password" id="signupConfirm" placeholder="Confirm password" required autocomplete="new-password" />
      <div class="msg-box" id="signupMsg"></div>
      <button type="submit" id="signupBtn">Create Account</button>
    </form>

    <div class="divider">or</div>

    <div class="auth-buttons">
      <button class="auth-btn" onclick="googleSignIn()">
        <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google" />
        <span>Continue with Google</span>
      </button>
      <button class="auth-btn" onclick="facebookSignIn()">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png" alt="Facebook" />
        <span>Continue with Facebook</span>
      </button>
      <button class="auth-btn" onclick="showPhoneInput()">
        <img src="https://img.icons8.com/ios-filled/50/phone--v1.png" alt="Phone" />
        <span>Continue with Mobile</span>
      </button>
    </div>

    <div class="toggle-text" id="toggleText">
      Don't have an account? <a onclick="toggleAuth()">Sign up</a>
    </div>
  </div>

  <!-- Phone Auth Bottom Sheet -->
  <div id="phoneSheet" class="bottom-sheet">
    <div class="sheet-content">
      <h3>Sign in with Mobile</h3>
      <input type="tel" id="phoneNumber" placeholder="+91 XXXXX XXXXX" />
      <div id="recaptcha-container"></div>
      <button onclick="sendOTP()">Send OTP</button>
      <input type="text" id="otp" placeholder="Enter OTP" />
      <button onclick="verifyOTP()">Verify OTP</button>
    </div>
  </div>
  <div id="backdrop" class="backdrop" onclick="closeSheet()"></div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script>
    // ── Firebase init ────────────────────────────────────────────
    const firebaseConfig = {
      apiKey: "AIzaSyAYlz1zWNhr1DflppMfzNPva0UFVso7Bpk",
      authDomain: "candle-d7f07.firebaseapp.com",
      projectId: "candle-d7f07",
      storageBucket: "candle-d7f07.appspot.com",
      messagingSenderId: "165415078791",
      appId: "1:165415078791:web:c764eb95f3d2272c1ce122"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // ── If already logged in, skip to homepage ───────────────────
    auth.onAuthStateChanged(user => {
      if (user) window.location.href = 'index.html';
    });

    // ── Open signup tab if ?mode=signup in URL ───────────────────
    if (new URLSearchParams(window.location.search).get('mode') === 'signup') {
      showSignup();
    }

    // ── Helpers ──────────────────────────────────────────────────
    function showMsg(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = 'msg-box ' + type;
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.classList.toggle('loading', loading);
      btn.textContent = loading
        ? (btnId === 'loginBtn' ? 'Logging in…' : 'Creating account…')
        : (btnId === 'loginBtn' ? 'Login' : 'Create Account');
    }

    function redirectHome() {
      window.location.href = 'index.html';
    }

    // ── Toggle between Login ↔ Signup ────────────────────────────
    let isLogin = true;

    function toggleAuth() {
      isLogin = !isLogin;
      isLogin ? showLogin() : showSignup();
    }

    function showLogin() {
      document.getElementById('loginForm').style.display  = 'block';
      document.getElementById('signupForm').style.display = 'none';
      document.getElementById('loginTitle').style.display  = 'block';
      document.getElementById('signupTitle').style.display = 'none';
      document.getElementById('toggleText').innerHTML =
        'Don\'t have an account? <a onclick="toggleAuth()">Sign up</a>';
      isLogin = true;
    }

    function showSignup() {
      document.getElementById('loginForm').style.display  = 'none';
      document.getElementById('signupForm').style.display = 'block';
      document.getElementById('loginTitle').style.display  = 'none';
      document.getElementById('signupTitle').style.display = 'block';
      document.getElementById('toggleText').innerHTML =
        'Already have an account? <a onclick="toggleAuth()">Login</a>';
      isLogin = false;
    }

    // ── Login ────────────────────────────────────────────────────
    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const pwd   = document.getElementById('loginPassword').value;

      setLoading('loginBtn', true);

      auth.signInWithEmailAndPassword(email, pwd)
        .then(() => redirectHome())
        .catch(err => {
          setLoading('loginBtn', false);
          showMsg('loginMsg', friendlyError(err.code), 'error');
        });
    });

    // ── Signup ───────────────────────────────────────────────────
    document.getElementById('signupForm').addEventListener('submit', e => {
      e.preventDefault();
      const name    = document.getElementById('signupName').value.trim();
      const email   = document.getElementById('signupEmail').value.trim();
      const pwd     = document.getElementById('signupPassword').value;
      const confirm = document.getElementById('signupConfirm').value;

      if (pwd !== confirm) {
        showMsg('signupMsg', 'Passwords do not match.', 'error');
        return;
      }
      if (pwd.length < 6) {
        showMsg('signupMsg', 'Password must be at least 6 characters.', 'error');
        return;
      }

      setLoading('signupBtn', true);

      auth.createUserWithEmailAndPassword(email, pwd)
        .then(cred => cred.user.updateProfile({ displayName: name }))
        .then(() => redirectHome())
        .catch(err => {
          setLoading('signupBtn', false);
          showMsg('signupMsg', friendlyError(err.code), 'error');
        });
    });

    // ── Google ───────────────────────────────────────────────────
    function googleSignIn() {
      auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
        .then(() => redirectHome())
        .catch(err => alert(err.message));
    }

    // ── Facebook ─────────────────────────────────────────────────
    function facebookSignIn() {
      auth.signInWithPopup(new firebase.auth.FacebookAuthProvider())
        .then(() => redirectHome())
        .catch(err => alert(err.message));
    }

    // ── Phone ────────────────────────────────────────────────────
    function showPhoneInput() {
      document.getElementById('phoneSheet').classList.add('active');
      document.getElementById('backdrop').classList.add('active');

      if (!window.recaptchaVerifier) {
        window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
          size: 'normal',
          callback: () => {}
        });
        window.recaptchaVerifier.render();
      }
    }

    function closeSheet() {
      document.getElementById('phoneSheet').classList.remove('active');
      document.getElementById('backdrop').classList.remove('active');
    }

    function sendOTP() {
      auth.signInWithPhoneNumber(document.getElementById('phoneNumber').value, window.recaptchaVerifier)
        .then(r => { window.confirmationResult = r; alert('OTP sent!'); })
        .catch(err => alert(err.message));
    }

    function verifyOTP() {
      window.confirmationResult.confirm(document.getElementById('otp').value)
        .then(() => { closeSheet(); redirectHome(); })
        .catch(() => alert('Invalid OTP. Please try again.'));
    }

    // ── Friendly error messages ───────────────────────────────────
    function friendlyError(code) {
      const map = {
        'auth/user-not-found':       'No account found with this email.',
        'auth/wrong-password':       'Incorrect password. Please try again.',
        'auth/invalid-email':        'Please enter a valid email address.',
        'auth/email-already-in-use': 'This email is already registered.',
        'auth/weak-password':        'Password must be at least 6 characters.',
        'auth/too-many-requests':    'Too many attempts. Please wait and try again.',
        'auth/network-request-failed': 'Network error. Check your connection.',
      };
      return map[code] || 'Something went wrong. Please try again.';
    }
  </script>
</body>
</html>
