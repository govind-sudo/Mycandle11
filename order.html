<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Placed — Glow &amp; Scent</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --primary: #7b5e57;
      --accent:  #5e443e;
      --secondary: #fffaf5;
      --shadow:  0 8px 28px rgba(0,0,0,0.10);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Open Sans', sans-serif; background: var(--secondary); color: #3b2f2f; min-height: 100vh; display: flex; flex-direction: column; }
    a { text-decoration: none; color: inherit; }

    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.85rem 2rem;
      background: rgba(255,250,245,0.95);
      box-shadow: var(--shadow);
      width: min(1200px, calc(100vw - 24px));
      margin: 10px auto 0;
      border-radius: 16px;
    }
    .logo { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: bold; color: #3b2f2f; }

    .success-page {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 3rem 1.5rem; text-align: center;
    }

    /* Animated checkmark */
    .check-circle {
      width: 90px; height: 90px; border-radius: 50%;
      background: linear-gradient(135deg, #4a7c59, #2ecc71);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.8rem;
      animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards;
      box-shadow: 0 12px 30px rgba(46,204,113,0.35);
    }
    .check-circle i { font-size: 2.2rem; color: white; }
    @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem; color: var(--accent);
      margin-bottom: 0.6rem;
      animation: fadeUp 0.6s ease 0.2s both;
    }
    .subtitle {
      font-size: 1rem; color: #888; margin-bottom: 2rem;
      animation: fadeUp 0.6s ease 0.3s both;
    }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    /* Order details card */
    .order-card {
      background: white; border-radius: 16px;
      padding: 1.8rem; max-width: 420px; width: 100%;
      box-shadow: var(--shadow); margin-bottom: 2rem;
      animation: fadeUp 0.6s ease 0.4s both;
    }

    .order-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.7rem 0; border-bottom: 1px solid #f0e8e4;
      font-size: 0.95rem;
    }
    .order-row:last-child { border-bottom: none; }
    .order-row .label { color: #888; font-size: 0.85rem; }
    .order-row .value { font-weight: 600; color: var(--accent); }

    .status-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: #e8f8ec; color: #1e7a3a;
      padding: 0.3rem 0.9rem; border-radius: 20px;
      font-size: 0.82rem; font-weight: 700;
    }

    /* Action buttons */
    .actions {
      display: flex; flex-direction: column; gap: 0.8rem;
      max-width: 420px; width: 100%;
      animation: fadeUp 0.6s ease 0.5s both;
    }

    .btn-primary {
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
      padding: 0.9rem; background: var(--primary); color: white;
      border-radius: 12px; font-weight: 700; font-size: 1rem;
      transition: background 0.3s, transform 0.2s;
    }
    .btn-primary:hover { background: var(--accent); transform: translateY(-2px); }

    .btn-secondary {
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
      padding: 0.9rem; background: transparent; color: var(--primary);
      border: 2px solid rgba(123,94,87,0.3); border-radius: 12px;
      font-weight: 700; font-size: 1rem;
      transition: all 0.2s;
    }
    .btn-secondary:hover { background: var(--primary); color: white; border-color: var(--primary); }

    /* Confetti candles decoration */
    .candle-row {
      font-size: 1.8rem; margin-bottom: 1.5rem; letter-spacing: 0.5rem;
      animation: fadeUp 0.6s ease 0.15s both;
    }

    footer {
      text-align: center; padding: 1.2rem;
      background: #3b2f2f; color: white; font-size: 0.88rem;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo">Glow &amp; Scent</a>
  </nav>

  <div class="success-page">

    <div class="check-circle">
      <i class="fas fa-check"></i>
    </div>

    <div class="candle-row">🕯️ 🌸 🕯️</div>

    <h1>Order Placed!</h1>
    <p class="subtitle">Thank you for your order. We'll get it ready with love.</p>

    <div class="order-card">
      <div class="order-row">
        <span class="label">Order ID</span>
        <span class="value" id="displayOrderId">—</span>
      </div>
      <div class="order-row">
        <span class="label">Amount Paid</span>
        <span class="value" id="displayAmount">—</span>
      </div>
      <div class="order-row">
        <span class="label">Status</span>
        <span class="status-badge"><i class="fas fa-circle" style="font-size:0.5rem;"></i> Confirmed</span>
      </div>
      <div class="order-row">
        <span class="label">Delivery</span>
        <span class="value">3–5 business days</span>
      </div>
    </div>

    <div class="actions">
      <a href="moreproduct.html" class="btn-primary">
        <i class="fas fa-shopping-bag"></i> Continue Shopping
      </a>
      <a href="userdashboard.html" class="btn-secondary">
        <i class="fas fa-box"></i> View My Orders
      </a>
    </div>

  </div>

  <footer>&copy; 2025 Glow &amp; Scent. All rights reserved.</footer>

  <script src="cart.js"></script>
  <script>
    async function loadOrderDetails() {
      const orderId = sessionStorage.getItem('lastOrderId');
      // We can still use the stored amount as a fallback or for immediate display
      const storedAmount = sessionStorage.getItem('lastAmount');

      if (orderId) {
        document.getElementById('displayOrderId').textContent = orderId;
        if (storedAmount) {
          document.getElementById('displayAmount').textContent = '₹' + Number(storedAmount).toFixed(2);
        }

        try {
          const response = await fetch(`${API_BASE}/api/orders/${orderId}`);
          if (response.ok) {
            const data = await response.json();
            // Update UI with real-time data from server
            document.getElementById('displayOrderId').textContent = data.id;
            document.getElementById('displayAmount').textContent = '₹' + Number(data.amount).toFixed(2);
            // You could also update status if it's dynamic
            // document.querySelector('.status-badge').innerHTML = ...
          }
        } catch (err) {
          console.error('Error fetching order details:', err);
        }
      }

      // Clear after showing (optional, but keep for now if user wants to see it on refresh)
      // sessionStorage.removeItem('lastOrderId');
      // sessionStorage.removeItem('lastAmount');
    }

    loadOrderDetails();
  </script>
</body>
</html>
